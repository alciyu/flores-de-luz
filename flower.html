    <style>
      /* Fondo oscuro de respaldo en el body */
      body {
        background-color: #080f1a !important;
        margin: 0;
        padding: 0;
        overflow: hidden;
        user-select: none;
      }

      /* Corrección del fondo nocturno a pantalla completa */
      .night {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        transform: none !important;
        z-index: 1 !important;
      }

      .firefly {
        z-index: 2 !important;
      }

      .flowers {
        z-index: 5 !important;
      }

      /* MEJORA 1: Transición suave de la letra (fade) */
      #lyrics {
        z-index: 10 !important;
        transition: opacity 0.8s ease-in-out !important;
      }

      .titulo {
        z-index: 10 !important;
      }

      /* MEJORA 2: Chispas del mouse y explosión al clic */
      .spark,
      .click-spark {
        z-index: 9999 !important;
        pointer-events: none;
        position: absolute;
        border-radius: 50%;
      }

      /* MEJORA 3: Botón flotante de audio */
      .audio-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 10000;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.12),
          rgba(255, 230, 0, 0.1)
        );
        border: 1px solid rgba(255, 255, 255, 0.35);
        color: #ffe600;
        padding: 10px 16px;
        border-radius: 25px;
        cursor: pointer;
        font-family: sans-serif;
        font-size: 0.9rem;
        font-weight: bold;
        backdrop-filter: blur(10px) saturate(160%);
        -webkit-backdrop-filter: blur(10px) saturate(160%);
        box-shadow:
          0 4px 18px rgba(0, 0, 0, 0.25),
          inset 0 1px 0 rgba(255, 255, 255, 0.4),
          0 0 15px rgba(255, 230, 0, 0.15);
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .audio-btn:hover {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.2),
          rgba(255, 230, 0, 0.25)
        );
        transform: scale(1.05);
        box-shadow:
          0 6px 22px rgba(0, 0, 0, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.5),
          0 0 25px rgba(255, 230, 0, 0.45);
      }

      .audio-btn:active {
        transform: scale(0.96);
      }

      /* MEJORA 4: Ajuste Responsive para Celulares */
      @media (max-width: 768px) {
        .flowers {
          transform: scale(0.65) translateY(10%);
          transform-origin: bottom center;
        }
        #lyrics > div:first-child {
          font-size: 1.1rem !important;
        }
        #lyrics > div:last-child {
          font-size: 0.85rem !important;
        }
        .titulo {
          font-size: 1.2rem !important;
          padding: 0 20px;
        }
        .audio-btn {
          top: 15px;
          right: 15px;
          padding: 8px 12px;
          font-size: 0.8rem;
        }
      }

      /* MEJORA 4b: pantallas muy pequeñas (celulares chicos) */
      @media (max-width: 420px) {
        .flowers {
          transform: scale(0.5) translateY(12%);
          transform-origin: bottom center;
        }
        #lyrics > div:first-child {
          font-size: 0.95rem !important;
        }
        #lyrics > div:last-child {
          font-size: 0.75rem !important;
        }
        .titulo {
          font-size: 1rem !important;
        }
        .audio-btn {
          top: 10px;
          right: 10px;
          padding: 6px 10px;
          font-size: 0.75rem;
        }
      }

      @keyframes floatFirefly {
        0% {
          transform: translateY(0px) translateX(0px);
          opacity: 0.1;
        }
        50% {
          opacity: 1;
        }
        100% {
          transform: translateY(-80px) translateX(40px);
          opacity: 0.1;
        }
      }
    </style>

    <script>
      // 1. Luciérnagas flotantes
      const night = document.querySelector(".night");
      if (night) {
        for (let i = 0; i < 35; i++) {
          let firefly = document.createElement("div");
          firefly.className = "firefly";
          firefly.style.cssText = `
            position: absolute;
            width: ${Math.random() * 4 + 2}px;
            height: ${Math.random() * 4 + 2}px;
            background: #ffe600;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffe600, 0 0 20px #ffe600;
            top: ${Math.random() * 100}vh;
            left: ${Math.random() * 100}vw;
            opacity: ${Math.random() * 0.6 + 0.2};
            animation: floatFirefly ${Math.random() * 6 + 6}s infinite ease-in-out alternate;
          `;
          night.appendChild(firefly);
        }
      }

      // 2. Chispas continuas al mover el mouse
      window.addEventListener("mousemove", (e) => {
        let spark = document.createElement("div");
        spark.className = "spark";
        spark.style.cssText = `
          position: absolute;
          left: ${e.pageX}px;
          top: ${e.pageY}px;
          width: 7px;
          height: 7px;
          background: #ffe600;
          border-radius: 50%;
          box-shadow: 0 0 10px #ffe600;
          pointer-events: none;
          transition: all 0.9s ease-out;
        `;
        document.body.appendChild(spark);
        setTimeout(() => {
          spark.style.transform = "scale(0) translateY(-20px)";
          spark.style.opacity = "0";
        }, 50);
        setTimeout(() => spark.remove(), 900);
      });

      // 3. Explosión de chispas al hacer CLIC
      window.addEventListener("click", (e) => {
        if (e.target.closest(".audio-btn")) return;

        const sparkCount = 16;
        for (let i = 0; i < sparkCount; i++) {
          let p = document.createElement("div");
          p.className = "click-spark";
          let angle = (i / sparkCount) * Math.PI * 2;
          let distance = Math.random() * 60 + 30;
          let x = Math.cos(angle) * distance;
          let y = Math.sin(angle) * distance;

          p.style.cssText = `
            left: ${e.pageX}px;
            top: ${e.pageY}px;
            width: ${Math.random() * 5 + 4}px;
            height: ${Math.random() * 5 + 4}px;
            background: #ffe600;
            box-shadow: 0 0 12px #ffe600, 0 0 20px #ffe600;
            transition: transform 0.6s cubic-bezier(0.1, 0.8, 0.3, 1), opacity 0.6s ease;
          `;
          document.body.appendChild(p);

          setTimeout(() => {
            p.style.transform = `translate(${x}px, ${y}px) scale(0)`;
            p.style.opacity = "0";
          }, 20);

          setTimeout(() => p.remove(), 650);
        }
      });

      // 4. Control del botón de Audio (Play / Pausa)
      // "bgAudio" (no "audio"): anim.js ya declara "var audio" global;
      // usar "const audio" aquí provocaba un SyntaxError de doble
      // declaración que rompía TODO este bloque de script (luciérnagas,
      // chispas del mouse, explosión de clic y botón de música).
      const bgAudio = document.getElementById("bg-audio");
      const musicBtn = document.getElementById("musicToggle");
      const musicIcon = document.getElementById("musicIcon");
      const musicText = document.getElementById("musicText");

      if (bgAudio && musicBtn) {
        bgAudio
          .play()
          .then(() => {
            musicIcon.textContent = "🎵";
            musicText.textContent = "Pausa";
          })
          .catch(() => {
            musicIcon.textContent = "🔇";
            musicText.textContent = "Play";
          });

        musicBtn.addEventListener("click", () => {
          if (bgAudio.paused) {
            bgAudio.play();
            musicIcon.textContent = "🎵";
            musicText.textContent = "Pausa";
          } else {
            bgAudio.pause();
            musicIcon.textContent = "🔇";
            musicText.textContent = "Play";
          }
        });
      }
    </script>
